services:
  postgres:
    # The source and restore clusters run the same immutable PG16 build used by
    # production. Keep one image identity so a tag move cannot split the proof.
    image: &postgres-test-image postgres:16@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-vendor_cp_test}
      VENDOR_DB_ADMIN_PASSWORD: admin
      VENDOR_DB_APP_USER_PASSWORD: app
      VENDOR_DB_PLATFORM_API_PASSWORD: platform
      VENDOR_DB_DISPATCHER_PASSWORD: dispatcher
      # Disposable localhost-only test DB. The production initializer creates
      # the permanent roles; trust lets the suite exercise each role without
      # copying test passwords into every DSN. The container binds only to
      # 127.0.0.1 on a throwaway port and never holds real data.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5439}:5432"
    volumes:
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/001-vendor-roles.sh:ro
      - ./deploy/postgres/bootstrap-credential-function.sql:/docker-entrypoint-initdb.d/002-bootstrap-credential-function.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d ${TEST_DB_NAME:-vendor_cp_test}"]
      interval: 2s
      timeout: 2s
      retries: 15
  postgres-restore:
    image: *postgres-test-image
    environment:
      # A separate empty cluster: no source-role initializer is mounted here.
      # The bootstrap identity must not collide with source globals.sql roles.
      POSTGRES_USER: restore_bootstrap
      POSTGRES_PASSWORD: restore-test-only
      POSTGRES_DB: restore_control
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TEST_RESTORE_DB_PORT:-5440}:5432"
    volumes:
      - postgres_restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_bootstrap -d restore_control"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_restore_data:
