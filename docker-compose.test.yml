services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TEST_DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-vendor_cp_test}
      # Disposable localhost-only test DB. The kernel's initial migration creates
      # app_user/platform_api/app_admin with LOGIN but no password, so TCP auth
      # would fail without trust; acceptable here — the container binds only to
      # 127.0.0.1 on a throwaway port and never holds real data.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${TEST_DB_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
