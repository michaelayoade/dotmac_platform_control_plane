[tool.poetry]
name = "dotmac-vendor-control-plane"
version = "0.1.0"
description = "DotMac Vendor Control Plane — a vendor/product-lifecycle assembly composed from the pinned dotmac-kernel. It is NOT a product data plane; it owns vendor-side accounts, provisioning contracts, and (later) deployment lifecycle."
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "vendor_cp", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# The kernel is PINNED EXACTLY and resolves ONLY from the private Forgejo index
# (ADR-0005). a69 is the Billing namespace release candidate and is intentionally
# unpublished until the three draft PRs are reviewable; clean installation is a
# release blocker, never a reason to substitute a path dependency. The `testing`
# extra ships the kernel's
# supported test kit (harness + fakes + provisioning contract + the WS8
# FakeLicenceSigner) this assembly's tests consume; `licensing` adds the Ed25519
# dependency `dotmac_kernel.licensing` needs, which the WS8 issuance slice
# requires to sign and to round-trip its envelopes through `verify_licence`.
# No copied kernel modules, no import-path shims.
dotmac-kernel = { version = "0.1.0a69", extras = [
    "testing",
    "licensing",
], source = "forgejo" }
# Vendor-owned immutable artifact identity and attestations. Exact-pinned from
# the same private index; its manifest and migration locator are composed by the
# assembly through the package's public top-level surface.
#
# a4 is required, not merely preferred. Through a3 the module declared its two
# tables in `ModuleManifest.tables` — the TENANT contract — while its migration
# actually creates platform-shaped tables (no `tenant_id`, REVOKEd from
# `app_user`). Nothing noticed, because nothing audited the live catalogue here.
# The composed audit added in `tests/migration/test_composed_live_catalog.py`
# does, and an a3 module fails it correctly: the declaration and the database
# disagree. a4 moves both tables to `platform_tables`, which is what makes the
# declaration true (ADR-0023).
dotmac-release-catalog = { version = "0.1.0a4", source = "forgejo" }
# Installed in shadow mode: the independent owner and its migration lineage are
# composed now, while the vendor-local allocation writer remains authoritative
# until historical commercial rows have evidence-backed product mappings and
# the data preflight in docs/ARCHITECTURE.md passes. New writes are
# product-qualified; that does not by itself authorize a writer cutover.
# Exact-pinned from the private index; never a path dependency and never a
# silent dual-write.
#
# a4 for the same reason as the release catalogue above: its `allocations` /
# `allocation_entries` become declared `platform_tables`, so the composed
# live-catalogue audit can hold them to the plane they are actually built on.
dotmac-entitlement-allocation = { version = "0.1.0a4", source = "forgejo" }
# The dual-plane approval-state owner (ADR-0026/ADR-0028), composed in SHADOW
# under the cutover contract in `docs/adr/0004-approvals-authority-cutover.md`.
# READ-ONLY here: `vendor_cp.approvals` remains the sole authoritative writer,
# and vendor migration `v012` takes away the write grants this module's own
# migration issues. See that migration for why Vendor owns that restriction.
dotmac-approvals = { version = "0.1.0a4", source = "forgejo" }
# The one operational-receivables owner, prepared on its platform plane only.
# Exact-pinned like every stateful Dotmac module.  a1 is intentionally not
# published until the Starter and adopter-preparation draft PRs are reviewable;
# this branch therefore remains release-blocked without pretending a path
# dependency is a deployable package.
dotmac-billing = { version = "0.1.0a1", source = "forgejo" }
uvicorn = "^0.30"
# The one control-plane database's driver (Postgres). There is exactly ONE
# database; no product DSNs, no cross-database access (deny-case D1/D2).
psycopg = { version = "^3.2", extras = ["binary"] }
# Migrations: the vendor lineage is composed with the kernel's shipped base
# lineage (dotmac_kernel.migrations.versions_dir) at deploy time.
alembic = "^1.13"

# Public Dotmac packages resolve from Forgejo; everything else from PyPI. Marked
# `explicit` so ONLY named Dotmac packages are pulled from here (no
# dependency-confusion aggregation of public names).
[[tool.poetry.source]]
name = "forgejo"
url = "https://registry.dotmac.io/api/packages/dotmac/pypi/simple"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.6"
mypy = "^1.11"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
[tool.ruff.lint.per-file-ignores]
# asserts are the point in tests; S105/S106 flag dummy fixture "passwords"
# (e.g. password_hash="x") that are not real secrets.
"tests/**" = ["S101", "S105", "S106"]
# The concurrency proof interpolates a per-test scratch TABLE NAME it generated
# itself (uuid4 hex) — table identifiers cannot be bound as parameters, and no
# external input reaches these statements.
"tests/migration/test_replay_concurrency.py" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vendor_cp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
