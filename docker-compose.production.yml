name: dotmac_vendor_control_plane

services:
  db:
    image: ${VENDOR_POSTGRES_IMAGE:-postgres:16@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d}
    environment:
      POSTGRES_DB: ${VENDOR_DB_NAME:-vendor_control_plane}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VENDOR_DB_BOOTSTRAP_PASSWORD:?Generated by the deploy owner}
      VENDOR_DB_ADMIN_PASSWORD: ${VENDOR_DB_ADMIN_PASSWORD:?Set VENDOR_DB_ADMIN_PASSWORD}
      VENDOR_DB_APP_USER_PASSWORD: ${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}
      VENDOR_DB_PLATFORM_API_PASSWORD: ${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}
      # Consumed by init-roles.sh on FIRST cluster initialisation only. An
      # already-initialised host never runs that script again, so there the
      # dispatcher password is an operator act — see
      # docs/operations/production-deployment.md.
      VENDOR_DB_DISPATCHER_PASSWORD: ${VENDOR_DB_DISPATCHER_PASSWORD:?Set VENDOR_DB_DISPATCHER_PASSWORD}
    volumes:
      - vendor_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/001-vendor-roles.sh:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U app_admin -d ${VENDOR_DB_NAME:-vendor_control_plane}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vendor_backend]

  manifest-init:
    image: ${VENDOR_POSTGRES_IMAGE:-postgres:16@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d}
    profiles: ["ops"]
    user: "0:0"
    network_mode: none
    volumes:
      - vendor_product_manifests:/manifests:rw
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown 10001:10001 /manifests &&
        chmod 0750 /manifests
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  app:
    image: ${VENDOR_APP_IMAGE:?Set VENDOR_APP_IMAGE to an immutable digest reference}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      # No MIGRATION_DATABASE_URL, deliberately. The long-running application
      # never migrates - `dotmac-platform admin migrate` runs in the one-shot
      # `ops` container below - and the accepted descriptor's app role declares
      # exactly two materials, DATABASE_URL and PLATFORM_DATABASE_URL. Handing
      # the app the `app_admin` DSN gave every process in this container a
      # standing BYPASSRLS owner credential it had no code path to use, and put
      # a third derived alias of the admin password into the exposure surface
      # the 2026-09-01 incident measured. The ops service keeps it: that is the
      # migration runner, and `owner_material` names it there.
    ports:
      - "127.0.0.1:${VENDOR_APP_PORT:-8100}:8000"
    volumes:
      - vendor_product_manifests:/run/dotmac/product-manifests:ro
      - ${VENDOR_LICENCE_SIGNING_KEY_HOST_FILE:?Set VENDOR_LICENCE_SIGNING_KEY_HOST_FILE}:/run/secrets/dotmac/vendor-control-plane/licence-signing/primary.key:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${VENDOR_APP_PIDS_LIMIT:-256}
    mem_limit: ${VENDOR_APP_MEM_LIMIT:-768m}
    stop_grace_period: 30s
    # `/health/ready`, not `/health`. The kernel's `/health` is liveness and says so
    # in its own docstring — it does not touch the database — so this wait used
    # to be satisfied by a container that could not serve a single request, and
    # `deploy_production.sh` would then declare the deploy successful. The
    # readiness route asks the one dependency this assembly has and answers 503
    # when it cannot reach it, which is what makes `--wait` mean something.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': 'vendor.dotmac.io'}); urllib.request.urlopen(r, timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vendor_frontend, vendor_backend]

  # The platform outbox relay — the drain that turns an activated commercial
  # agreement into a staged entitlement allocation.
  #
  # Its own service rather than a thread inside `app`, for three reasons that
  # are each independently sufficient. It holds a DIFFERENT database credential
  # (`platform_outbox_dispatcher`, which has EXECUTE on two kernel functions and
  # no table privilege at all), so co-hosting would put that credential in every
  # request-serving process. It has a different failure mode — a wedged relay
  # must be restartable without dropping API traffic. And a relay inside the API
  # would scale with the API, which is the wrong axis entirely.
  #
  # No published port. It serves nothing; it polls.
  relay:
    image: ${VENDOR_APP_IMAGE:?Set VENDOR_APP_IMAGE to an immutable digest reference}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      # The dispatcher DSN. A THIRD ROLE on the one control-plane database, not
      # a second database: it can lease and settle outbox rows through the
      # kernel's `SECURITY DEFINER` functions and can read no business table.
      #
      # The material is held in OpenBao at
      # secret/dotmac/vendor-control-plane/production/relay-dispatcher and
      # reaches this file only through the host-local `.env` that
      # `materialize_production_secrets.py` renders. No value is ever committed.
      VENDOR_RELAY_DISPATCHER_DATABASE_URL: postgresql+psycopg://platform_outbox_dispatcher:${VENDOR_DB_DISPATCHER_PASSWORD:?Set VENDOR_DB_DISPATCHER_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      # No MIGRATION_DATABASE_URL. The relay never migrates, and handing it the
      # `app_admin` BYPASSRLS credential would give a long-running process a
      # standing owner credential it has no code path to use — the same defect
      # the `app` service's comment above records.
    volumes:
      - vendor_product_manifests:/run/dotmac/product-manifests:ro
      - ${VENDOR_LICENCE_SIGNING_KEY_HOST_FILE:?Set VENDOR_LICENCE_SIGNING_KEY_HOST_FILE}:/run/secrets/dotmac/vendor-control-plane/licence-signing/primary.key:ro
    depends_on:
      db:
        condition: service_healthy
    # The INSTALLED console script, like every other production entry point:
    # no interpreter in front of it, no `src` in the image for a path to resolve
    # against. `--worker-id` is required rather than defaulted to a hostname
    # because the outbox lease is held BY that identifier.
    command: ["dotmac-platform", "relay", "run", "--worker-id", "${VENDOR_RELAY_WORKER_ID:-vendor-cp-prod-relay-1}"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${VENDOR_RELAY_PIDS_LIMIT:-128}
    mem_limit: ${VENDOR_RELAY_MEM_LIMIT:-256m}
    # Longer than the poll interval and longer than one delivery, so SIGTERM
    # lets the current batch settle instead of leaving a lease for the stale
    # reclaim to pick up.
    stop_grace_period: 30s
    # No healthcheck, deliberately, and this is not an omission.
    #
    # A process-local probe here could only report that the process is running,
    # which is precisely the claim a WEDGED relay also satisfies — alive,
    # polling, settling nothing. The real liveness fact is the durable heartbeat
    # in `public.relay_heartbeats`, and the thing that reads it is
    # `/health/ready` on the `app` service plus `dotmac-platform relay health`.
    # A green checkmark here beside a red readiness probe would be worse than no
    # checkmark at all.
    networks: [vendor_backend]

  ops:
    image: ${VENDOR_APP_IMAGE:?Set VENDOR_APP_IMAGE to an immutable digest reference}
    profiles: ["ops"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_admin:${VENDOR_DB_ADMIN_PASSWORD:?Set VENDOR_DB_ADMIN_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
    volumes:
      - vendor_product_manifests:/run/dotmac/product-manifests:rw
      - ${VENDOR_LICENCE_SIGNING_KEY_HOST_FILE:?Set VENDOR_LICENCE_SIGNING_KEY_HOST_FILE}:/run/secrets/dotmac/vendor-control-plane/licence-signing/primary.key:ro
    depends_on:
      db:
        condition: service_healthy
    # No entrypoint. The image has none either, so
    # `docker compose run --rm --no-deps ops dotmac-platform ...` executes the
    # INSTALLED console script directly — there is no interpreter in front of it
    # turning the first argument into a path, and no `src` in this image for
    # such a path to resolve against.
    #
    # `docker compose run` propagates the container's exit status unchanged,
    # which is what keeps the CLI's 3 (an owner refused) and 4 (no evidence)
    # distinguishable from outside the container.
    command: ["dotmac-platform", "diagnose", "self"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [vendor_backend]

volumes:
  vendor_postgres_data:
  vendor_product_manifests:

networks:
  vendor_frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  vendor_backend:
    internal: true
