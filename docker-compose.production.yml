name: dotmac_vendor_control_plane

services:
  db:
    image: ${VENDOR_POSTGRES_IMAGE:-postgres:16@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d}
    environment:
      POSTGRES_DB: ${VENDOR_DB_NAME:-vendor_control_plane}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VENDOR_DB_BOOTSTRAP_PASSWORD:?Generated by the deploy owner}
      VENDOR_DB_ADMIN_PASSWORD: ${VENDOR_DB_ADMIN_PASSWORD:?Set VENDOR_DB_ADMIN_PASSWORD}
      VENDOR_DB_APP_USER_PASSWORD: ${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}
      VENDOR_DB_PLATFORM_API_PASSWORD: ${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}
    volumes:
      - vendor_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/001-vendor-roles.sh:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U app_admin -d ${VENDOR_DB_NAME:-vendor_control_plane}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vendor_backend]

  manifest-init:
    image: ${VENDOR_POSTGRES_IMAGE:-postgres:16@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d}
    profiles: ["ops"]
    user: "0:0"
    network_mode: none
    volumes:
      - vendor_product_manifests:/manifests:rw
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown 10001:10001 /manifests &&
        chmod 0750 /manifests
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  app:
    image: ${VENDOR_APP_IMAGE:?Set VENDOR_APP_IMAGE to an immutable digest reference}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_admin:${VENDOR_DB_ADMIN_PASSWORD:?Set VENDOR_DB_ADMIN_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
    ports:
      - "127.0.0.1:${VENDOR_APP_PORT:-8100}:8000"
    volumes:
      - vendor_product_manifests:/run/dotmac/product-manifests:ro
      - ${VENDOR_LICENCE_SIGNING_KEY_HOST_FILE:?Set VENDOR_LICENCE_SIGNING_KEY_HOST_FILE}:/run/secrets/dotmac/vendor-control-plane/licence-signing/primary.key:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${VENDOR_APP_PIDS_LIMIT:-256}
    mem_limit: ${VENDOR_APP_MEM_LIMIT:-768m}
    stop_grace_period: 30s
    # `/health/ready`, not `/health`. The kernel's `/health` is liveness and says so
    # in its own docstring — it does not touch the database — so this wait used
    # to be satisfied by a container that could not serve a single request, and
    # `deploy_production.sh` would then declare the deploy successful. The
    # readiness route asks the one dependency this assembly has and answers 503
    # when it cannot reach it, which is what makes `--wait` mean something.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': 'vendor.dotmac.io'}); urllib.request.urlopen(r, timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vendor_frontend, vendor_backend]

  ops:
    image: ${VENDOR_APP_IMAGE:?Set VENDOR_APP_IMAGE to an immutable digest reference}
    profiles: ["ops"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${VENDOR_DB_APP_USER_PASSWORD:?Set VENDOR_DB_APP_USER_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:${VENDOR_DB_PLATFORM_API_PASSWORD:?Set VENDOR_DB_PLATFORM_API_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_admin:${VENDOR_DB_ADMIN_PASSWORD:?Set VENDOR_DB_ADMIN_PASSWORD}@db:5432/${VENDOR_DB_NAME:-vendor_control_plane}
    volumes:
      - vendor_product_manifests:/run/dotmac/product-manifests:rw
      - ${VENDOR_LICENCE_SIGNING_KEY_HOST_FILE:?Set VENDOR_LICENCE_SIGNING_KEY_HOST_FILE}:/run/secrets/dotmac/vendor-control-plane/licence-signing/primary.key:ro
    depends_on:
      db:
        condition: service_healthy
    # No entrypoint. The image has none either, so
    # `docker compose run --rm --no-deps ops dotmac-platform ...` executes the
    # INSTALLED console script directly — there is no interpreter in front of it
    # turning the first argument into a path, and no `src` in this image for
    # such a path to resolve against.
    #
    # `docker compose run` propagates the container's exit status unchanged,
    # which is what keeps the CLI's 3 (an owner refused) and 4 (no evidence)
    # distinguishable from outside the container.
    command: ["dotmac-platform", "diagnose", "self"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [vendor_backend]

volumes:
  vendor_postgres_data:
  vendor_product_manifests:

networks:
  vendor_frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  vendor_backend:
    internal: true
