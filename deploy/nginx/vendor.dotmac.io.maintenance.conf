server {
    listen 80;
    listen [::]:80;
    server_name vendor.dotmac.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vendor.dotmac.io;

    ssl_certificate /etc/letsencrypt/live/vendor.dotmac.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vendor.dotmac.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        add_header X-Dotmac-Maintenance vendor-cp always;
        add_header Retry-After 120 always;
        return 503;
    }
}
