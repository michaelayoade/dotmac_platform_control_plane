name: Deploy immutable image to production

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: >-
          Exact successful CI run id for the revision being deployed. Verified
          against repository, workflow, terminal conclusion, protected main,
          SHA shape, current main, and every required gate — including that
          none of them SKIPPED, which a run-level success hides.
        required: true
        type: string
      image_digest:
        description: >-
          Exact digest to deploy. Checked against the release receipt of the
          accepted candidate built from that revision — a pasted digest proves
          only that somebody could paste it.
        required: true
        type: string
      target_server_name:
        description: Explicit production target identity
        required: true
        type: string

permissions:
  contents: read
  packages: read
  checks: read
  actions: read

concurrency:
  group: vendor-control-plane-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      TARGET_SERVER_NAME: ${{ inputs.target_server_name }}
      TARGET_HOST: ${{ vars.VENDOR_PRODUCTION_HOST }}
      TARGET_USER: ${{ vars.VENDOR_PRODUCTION_USER }}
      TARGET_DIR: ${{ vars.VENDOR_PRODUCTION_DEPLOY_DIR }}
    steps:
      - name: Require the named target and an immutable digest
        env:
          DISPATCHED_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$DISPATCHED_REF" = "main" || {
            echo "Production deploys may only use the adapter on main." >&2
            exit 1
          }
          [[ "$TARGET_SERVER_NAME" != "vendor-cp-prod" ]] && {
            echo "target_server_name must be vendor-cp-prod" >&2
            exit 1
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$TARGET_HOST"
          test -n "$TARGET_USER"
          test -n "$TARGET_DIR"

      - name: Check out the deployment adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── The digest is not the evidence; the receipt is ─────────────────
      - name: Verify the source revision earned its way here
        id: revision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          python3 .github/candidate/verify_source_revision.py \
            --run-id "${CI_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-path .github/workflows/ci.yml \
            --branch main \
            --current-main "$current_main"
          echo "source_sha=$current_main" >> "$GITHUB_OUTPUT"

      - name: Require a release receipt binding this digest to that revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.revision.outputs.source_sha }}
        run: |
          set -euo pipefail
          # A digest an operator pasted proves only that it could be pasted.
          # The receipt is what says these exact bytes were ACCEPTED before
          # they were published, and it names the revision they came from — so
          # deploying requires finding it, not retyping its conclusion.
          mkdir -p receipt
          gh run download --repo "$GITHUB_REPOSITORY" \
            --name "release-receipt-${SOURCE_SHA}" --dir receipt \
            || { echo "no release receipt exists for ${SOURCE_SHA}; that revision has no accepted candidate" >&2; exit 1; }
          test -s receipt/release-receipt.json \
            || { echo "the release receipt for ${SOURCE_SHA} is empty" >&2; exit 1; }
          python3 - <<'PYCHECK'
          import json, os, sys
          receipt = json.load(open("receipt/release-receipt.json"))
          problems = []
          if receipt.get("contract") != "dotmac-candidate-release-receipt/1":
              problems.append(f"unknown receipt contract {receipt.get('contract')!r}")
          if receipt.get("source_revision") != os.environ["SOURCE_SHA"]:
              problems.append(
                  f"receipt names revision {receipt.get('source_revision')!r}, "
                  f"not {os.environ['SOURCE_SHA']!r}"
              )
          if receipt.get("registry_digest") != os.environ["IMAGE_DIGEST"]:
              problems.append(
                  f"receipt records digest {receipt.get('registry_digest')!r}, "
                  f"but this deploy was asked for {os.environ['IMAGE_DIGEST']!r}"
              )
          if problems:
              print("REFUSED:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              raise SystemExit(1)
          print(f"receipt binds {receipt['registry_digest']} to {receipt['source_revision']}")
          PYCHECK

      - name: Install the production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VENDOR_PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VENDOR_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/vendor-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Verify that the image exists
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker manifest inspect \
            "ghcr.io/michaelayoade/dotmac_vendor_control_plane@${IMAGE_DIGEST}" \
            >/dev/null

      - name: Install the versioned deployment adapter
        run: |
          set -euo pipefail
          remote="${TARGET_USER}@${TARGET_HOST}"
          ssh -i "$HOME/.ssh/vendor-production" "$remote" \
            "mkdir -p '$TARGET_DIR/scripts' '$TARGET_DIR/deploy/postgres' \
              '$TARGET_DIR/src/vendor_cp'"
          # `deploy/product.toml` travels with the adapter so the recovery
          # bundle can record WHICH accepted contract a restore must satisfy.
          # It is delivered read-only reference material: nothing on the host
          # writes it, and ADR-0017 s 2 keeps its promotion in Git.
          rsync -azR -e "ssh -i $HOME/.ssh/vendor-production" \
            .env.production.example \
            docker-compose.production.yml \
            deploy/product.toml \
            scripts/deploy_production.sh \
            scripts/deploy_production_with_registry_token.sh \
            scripts/materialize_production_secrets.py \
            deploy/postgres/init-roles.sh \
            src/vendor_cp/product_release_pins.py \
            src/vendor_cp/production_secrets.py \
            "$remote:$TARGET_DIR/"

      - name: Reconcile assembly-owned host declarations
        run: |
          set -euo pipefail
          remote="${TARGET_USER}@${TARGET_HOST}"
          ssh -i "$HOME/.ssh/vendor-production" "$remote" \
            "cd '$TARGET_DIR' && \
              env PYTHONPATH=src python3 scripts/materialize_production_secrets.py \
                reconcile-declarations \
                --env-template .env.production.example \
                --env-file .env"

      - name: Deploy the approved digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="${TARGET_USER}@${TARGET_HOST}"
          printf '%s' "$GHCR_TOKEN" \
            | ssh -i "$HOME/.ssh/vendor-production" "$remote" \
              "cd '$TARGET_DIR' && \
                bash scripts/deploy_production_with_registry_token.sh \
                  '$IMAGE_DIGEST' '$GITHUB_ACTOR'"
