name: Gate 0 installed SSH conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-sshd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Public candidate observation only, before dependencies or host changes.
      # This neither qualifies native tools nor creates an operational selector.
      - name: Observe fixed public native input candidates (non-root)
        timeout-minutes: 5
        run: |
          /usr/bin/python3.12 -I -B -m unittest discover -s conformance -p 'test_gate0_*_observation.py' -v
          /usr/bin/python3.12 -I -B .github/candidate/observe_gate0_native_inputs.py
          /usr/bin/python3.12 -I -B .github/candidate/observe_gate0_ubuntu_packages.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - name: Install locked dependencies and the built wheel
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          runtime_root="$(mktemp -d /tmp/gate0-installed-runtime.XXXXXXXX)"
          chmod 755 "$runtime_root"
          export POETRY_VIRTUALENVS_IN_PROJECT=false
          export POETRY_VIRTUALENVS_PATH="$runtime_root"
          echo "POETRY_VIRTUALENVS_IN_PROJECT=false" >> "$GITHUB_ENV"
          echo "POETRY_VIRTUALENVS_PATH=$runtime_root" >> "$GITHUB_ENV"
          poetry install
          poetry build --format wheel
          poetry run python -m pip install --force-reinstall --no-deps dist/*.whl
          # The unprivileged SSH worker must traverse the installed interpreter
          # without opening the checkout. Freeze its dedicated dependency tree.
          sudo chown -R root:root "$runtime_root"
          sudo chmod -R go-w "$runtime_root"
      - name: Verify exact public Ubuntu artifacts and prepare disposable binaries
        run: |
          python3 -I -B - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gate0-ssh-artifacts"
          root.mkdir(mode=0o700)
          pins = json.loads(pathlib.Path("conformance/openssh-ubuntu-artifacts.json").read_bytes())
          assert pins["schema"] == "Gate0HostedSshArtifacts.v1"
          descriptor = {}
          for item in pins["artifacts"]:
              assert item["url"].startswith("https://security.ubuntu.com/ubuntu/pool/main/o/openssh/")
              assert item["version"] == "1:9.6p1-3ubuntu13.19" and item["architecture"] == "amd64"
              with urllib.request.urlopen(item["url"], timeout=20) as response:
                  assert response.geturl() == item["url"]
                  data = response.read(item["size"] + 1)
              assert len(data) == item["size"]
              assert hashlib.sha256(data).hexdigest() == item["sha256"]
              archive = root / (item["package"] + ".deb")
              archive.write_bytes(data)
              extracted = root / item["package"]
              subprocess.run(["dpkg-deb", "--extract", str(archive), str(extracted)], check=True, timeout=20)
              binary = extracted / item["binary_path"]
              role = "server" if item["package"] == "openssh-server" else "client"
              descriptor[role] = {"path": str(binary), "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(), "archive_sha256": item["sha256"], "package_version": item["version"]}
          path = root / "qualified-binaries.json"
          path.write_text(json.dumps(descriptor, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("GATE0_SSHD_QUALIFICATION_JSON=" + str(path) + "\n")
          PYTHON
      - name: Run installed-wheel conformance with a loopback-only task daemon
        run: |
          task_dir="$RUNNER_TEMP/gate0-installed-conformance"
          mkdir -m 755 "$task_dir"
          cp conformance/test_gate0_real_sshd.py conformance/gate0_synthetic_sshd_worker.py "$task_dir/"
          python_path="$(poetry env info --executable)"
          cd "$task_dir"
          sudo --preserve-env=GITHUB_ACTIONS,GATE0_SSHD_QUALIFICATION_JSON "$python_path" -m pytest -c /dev/null -q test_gate0_real_sshd.py --junitxml="$RUNNER_TEMP/gate0-installed-sshd.xml" -o junit_family=xunit1
      - name: Prove native descendant cleanup from the installed wheel
        run: |
          set -euo pipefail
          task_dir="$RUNNER_TEMP/gate0-installed-conformance"
          cp conformance/test_gate0_finite_launch.py "$task_dir/"
          python_path="$(poetry env info --executable)"
          sudo mkdir -m 700 /sys/fs/cgroup/dotmac-gate0
          trap 'sudo rmdir /sys/fs/cgroup/dotmac-gate0' EXIT
          cd "$task_dir"
          sudo --preserve-env=GITHUB_ACTIONS "$python_path" -m pytest -c /dev/null -q test_gate0_finite_launch.py -k 'not installed_supervise_command' --junitxml="$RUNNER_TEMP/gate0-installed-cgroup.xml" -o junit_family=xunit1
      - name: Retain exact public artifact identities and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate0-installed-sshd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-input-observation.json
            ${{ runner.temp }}/ubuntu-package-observation.json
            ${{ runner.temp }}/gate0-ssh-artifacts/qualified-binaries.json
            ${{ runner.temp }}/gate0-installed-sshd.xml
            ${{ runner.temp }}/gate0-installed-cgroup.xml
          if-no-files-found: error
          retention-days: 30

  role-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build an unpublished finite-role candidate
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse HEAD)"
          DOCKER_BUILDKIT=1 docker build --target gate0-role \
            --secret id=forgejo_token,env=FORGEJO_READ_TOKEN \
            --build-arg "SOURCE_REVISION=$source_revision" \
            --tag gate0-role-qualified-local .
          docker image inspect gate0-role-qualified-local > "$RUNNER_TEMP/gate0-role-image.json"
      - name: Check those image bytes with no network or operational inputs
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add SYS_CHROOT \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=8m \
            --mount type=bind,source="$PWD/conformance/gate0_role_image_smoke.py",target=/qualification.py,readonly \
            --entrypoint /opt/venv/bin/python gate0-role-qualified-local \
            -I -B /qualification.py > "$RUNNER_TEMP/gate0-role-smoke.json"
      - name: Prove native capability and socket boundaries on those image bytes
        run: |
          bash .github/candidate/accept_gate0_network.sh gate0-role-qualified-local "$RUNNER_TEMP/gate0-role-native-network.json"
      - name: Retain candidate identity and smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate0-role-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gate0-role-image.json
            ${{ runner.temp }}/gate0-role-smoke.json
            ${{ runner.temp }}/gate0-role-native-network.json
          if-no-files-found: error
          retention-days: 30
