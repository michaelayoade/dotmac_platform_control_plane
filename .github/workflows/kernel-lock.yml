# Resolve a `dotmac-kernel` lock entry against the private index, and prove the
# bytes it names are the bytes the index actually publishes.
#
# This exists because a lock entry is the one part of a pin change that CANNOT
# be written by hand or by a workstation. Its two sha256 values are facts about
# published artifacts, and the only honest way to obtain them is to resolve
# against the index that holds them. An implementation lane asked to produce
# them offline has exactly two options — refuse, or invent — and one of those is
# catastrophic.
#
# So the credential lives here and the resolution happens here. The job UPLOADS
# a manifest/lock PAIR and its evidence; it never commits, never opens a pull
# request, and never hands the credential to the lane that will apply them.
#
# It is `workflow_dispatch` only. Nothing schedules it and no push triggers it:
# a lock move is an authored act.
#
# ── TWO CHECKOUTS, AND WHY ──────────────────────────────────────────────────
#
# The ref under resolution is caller-supplied and is not trusted. It supplies
# the MANIFEST TO RESOLVE. It must never supply THE CODE THAT RESOLVES.
#
# The first version of this workflow checked out that ref alone and then ran
# `uses: ./.github/actions/setup-poetry` — a local composite action loaded from
# the checked-out tree. That is the ref's own code, executing in a job where
# `FORGEJO_READ_TOKEN` is present, before anything has looked at it. It also
# read `.github/bootstrap/poetry-requirements.txt` from that tree, so even the
# hash-pinned bootstrap was pinned by whoever wrote the ref.
#
# So: the workspace ROOT is `github.sha` — the commit that defines this file,
# the code an operator approved by dispatching it — and every local action,
# every script and every bootstrap file resolves from there. The ref under
# resolution is checked out BESIDE it, at `work/`, and is only ever read as
# data or resolved against by Poetry.
#
# WHAT THIS DOES NOT CLOSE. `poetry lock` still runs against a manifest the ref
# owns, in a step that holds the credential, and resolution can execute a build
# backend when a candidate has no wheel metadata. `manifest-guard` narrows that
# to packages the declared index serves — it refuses an off-index `path`, `git`
# or `url` dependency, a second source, a `forgejo` source whose URL has moved
# (Poetry keys the credential by source NAME, so that alone would post it to
# another host with nothing untrusted executing), and `requires-plugins`. What
# remains is: a published package on the declared index whose sdist build
# backend runs code. That is the same exposure `poetry install` already has in
# CI, and this workflow does not reduce it.
#
# Nor does the reachability check below make the ref trustworthy. It proves the
# commit is reachable from a branch of THIS repository — which excludes a fork
# pull request's head commit, still checkoutable by SHA — and nothing more. A
# branch here can be attacker-authored, and a pin change IS a branch. It is
# defence in depth, and it is not the fix.

name: Kernel lock

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          The EXACT commit SHA to resolve against. A branch name is refused —
          a branch moves, and a lock resolved against "whatever main was" names
          a tree nobody reviewed.
        required: true
        type: string
      kernel_version:
        description: The dotmac-kernel version to pin, e.g. 0.1.0a102.
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but an exact commit
        env:
          REF: ${{ inputs.ref }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          # A 40-hex ref is the only input that cannot mean something different
          # tomorrow. `main`, a branch, a tag and a short SHA are all refused by
          # the same rule rather than by four special cases.
          if ! printf '%s' "${REF}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit SHA, got '${REF}'"
            exit 1
          fi
          if ! printf '%s' "${KERNEL_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::kernel_version is not a PEP 440 release, got '${KERNEL_VERSION}'"
            exit 1
          fi

      # THE TRUSTED CHECKOUT — the workspace root, and the only place a local
      # action, a script or the Poetry bootstrap may come from. `github.sha` is
      # the commit carrying this workflow file, so the resolver code and the
      # rules it enforces are the same revision an operator dispatched.
      - name: Check out the tooling from the commit that defines this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: The requested ref is reachable from a branch of this repository
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Defence in depth, with a stated premise. This excludes a commit
          # that exists in this repository's object store but is on no branch
          # — a fork pull request's head, which `actions/checkout` will happily
          # resolve by SHA. It does NOT establish that anyone reviewed the
          # commit: a branch here can be attacker-authored, and the pin change
          # this workflow serves arrives as one.
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git rev-parse --quiet --verify "${REF}^{commit}" > /dev/null; then
            echo "::error::${REF} is not present in this repository after fetching"
            echo "::error::every branch head. It is either not a commit here at all, or"
            echo "::error::reachable only as a pull-request head — neither is dispatchable."
            exit 1
          fi
          BRANCHES=$(git branch --remotes --contains "${REF}" --format='%(refname:short)')
          if [ -z "${BRANCHES}" ]; then
            echo "::error::${REF} is on no branch of this repository. A commit"
            echo "::error::reachable only as a pull-request head is not dispatchable here."
            exit 1
          fi
          echo "reachable from:"
          printf '  %s\n' ${BRANCHES}

      # THE UNTRUSTED CHECKOUT. Data, beside the tooling — never above it.
      - name: Check out the ref under resolution, beside the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: work

      - name: The checkout is the commit that was asked for
        working-directory: work
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # `actions/checkout` resolving something other than what was requested
          # would be silent, and every downstream fact would describe the wrong
          # tree. One comparison closes that.
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL}" != "${REF}" ]; then
            echo "::error::checked out ${ACTUAL}, asked for ${REF}"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The repository-prescribed Poetry, hash-locked from
      # .github/bootstrap/poetry-requirements.txt. Naming a version here would
      # be a second declaration free to disagree with that one. Resolved from
      # the workspace root, which is the TRUSTED checkout — see the header.
      - uses: ./.github/actions/setup-poetry

      - name: Move the pin, and refuse a manifest that would misdirect the credential
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          # Both steps run the TRUSTED module against the untrusted manifest.
          # The edit moves only the version inside the dotmac-kernel
          # declaration: the extras and the source stay exactly as the tree has
          # them, because a lock resolved against different extras is a
          # different lock.
          python scripts/kernel_lock.py set-kernel-version \
            --manifest work/pyproject.toml --kernel-version "${KERNEL_VERSION}"
          python scripts/kernel_lock.py manifest-guard \
            --manifest work/pyproject.toml --kernel-version "${KERNEL_VERSION}"

      - name: There is a credential to resolve with
        env:
          FORGEJO_CREDENTIAL: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Deliberately AFTER the manifest guard: no step holds the
          # credential until the untrusted manifest has been judged.
          #
          # An unconfigured secret interpolates to the empty string. Everything
          # downstream then fails for a reason that reads like an index fault,
          # and the evidence scan — which has nothing to look for — would have
          # reported the evidence clean. Say it here instead.
          if [ -z "${FORGEJO_CREDENTIAL:-}" ]; then
            echo "::error::FORGEJO_READ_TOKEN is unset or empty in this repository."
            echo "::error::Its owner is OpenBao secret/dotmac/forgejo/read-token#value;"
            echo "::error::this workflow consumes the projection, it does not fetch it."
            exit 1
          fi
          echo "the credential is present"

      - name: Keep the pre-resolution lock for comparison
        run: cp work/poetry.lock /tmp/poetry.lock.before

      - name: Resolve the kernel pin, and nothing else
        working-directory: work
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          poetry lock 2>&1 | tee /tmp/resolver.log

      - name: Only dotmac-kernel moved
        run: |
          set -euo pipefail
          # The drift gate, and it is the WHOLE lock. `poetry lock` is free to
          # re-resolve the entire graph, and a lock carrying an unrelated bump
          # — or an unrelated package quietly repointed at a different index,
          # same name, same version, same files — is a dependency change nobody
          # asked for arriving inside a pin change nobody would re-read.
          python scripts/kernel_lock.py drift \
            --before /tmp/poetry.lock.before --after work/poetry.lock

      - name: The lock's hashes are the index's bytes
        env:
          TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          trap 'rm -f -- "${HOME}/.netrc"' EXIT HUP INT TERM
          umask 077
          : > "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
          printf 'machine %s login %s password %s\n' \
            "registry.dotmac.io" "ci-reader" "${TOKEN}" >> "${HOME}/.netrc"

          # Download the artifacts and hash them. Comparing the lock against the
          # index's own advertised hashes would compare the index with itself;
          # this compares the lock against BYTES.
          mkdir -p /tmp/artifacts
          curl --netrc -sS --fail -o /tmp/index.html \
            "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/dotmac-kernel/"

          python - <<'PY'
          import hashlib, html.parser, os, pathlib, subprocess, sys, tomllib

          version = os.environ["KERNEL_VERSION"]

          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      for key, value in attrs:
                          if key == "href" and value:
                              self.hrefs.append(value)

          parser = Links()
          parser.feed(pathlib.Path("/tmp/index.html").read_text())

          wanted = {
              f"dotmac_kernel-{version}-py3-none-any.whl",
              f"dotmac_kernel-{version}.tar.gz",
          }
          urls = {}
          for href in parser.hrefs:
              name = href.split("#", 1)[0].rsplit("/", 1)[-1]
              if name in wanted:
                  urls[name] = href.split("#", 1)[0]

          missing = wanted - set(urls)
          if missing:
              # An absent artifact is a refusal. A resolver error later would
              # report this as a lock problem rather than as "it was never
              # published", which is the fact that matters.
              print("::error::not published on the index: " + ", ".join(sorted(missing)))
              sys.exit(1)

          observed = {}
          for name, url in sorted(urls.items()):
              target = f"/tmp/artifacts/{name}"
              subprocess.run(
                  ["curl", "--netrc", "-sS", "--fail", "-o", target, url], check=True
              )
              digest = hashlib.sha256(pathlib.Path(target).read_bytes()).hexdigest()
              observed[name] = f"sha256:{digest}"
              print(f"{name}  {digest}")

          with open("work/poetry.lock", "rb") as handle:
              data = tomllib.load(handle)
          entry = next(
              item for item in data["package"] if item["name"] == "dotmac-kernel"
          )
          if entry["version"] != version:
              print(f"::error::lock resolved {entry['version']}, asked for {version}")
              sys.exit(1)
          locked = {f["file"]: f["hash"] for f in entry.get("files", [])}

          for name, digest in observed.items():
              if locked.get(name) != digest:
                  print(
                      f"::error::{name}: lock says {locked.get(name)!r}, "
                      f"the published bytes hash to {digest}"
                  )
                  sys.exit(1)
          if set(locked) != set(observed):
              print(
                  "::error::lock names files the index does not publish, or omits one: "
                  f"lock={sorted(locked)} index={sorted(observed)}"
              )
              sys.exit(1)
          print("the lock's two hashes are the published bytes")
          PY

      - name: The lock and the pyproject edit agree
        working-directory: work
        run: |
          set -euo pipefail
          # A lock carries a content-hash derived from pyproject. Applying this
          # lock WITHOUT the identical version edit produces a tree whose lock
          # does not describe its own manifest, and `poetry check --lock` is the
          # thing that says so. Proving it here means the lane learns it from
          # the evidence rather than from a red pipeline.
          poetry check --lock

      - name: Assemble the evidence — the manifest and the lock, bound together
        env:
          FORGEJO_CREDENTIAL: ${{ secrets.FORGEJO_READ_TOKEN }}
          REF: ${{ inputs.ref }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Every coordinate crosses as a shell variable, never as a `${{ }}`
          # interpolation into this script. Both inputs are regex-validated in
          # step 1, so the old direct interpolation was not exploitable — but it
          # was one deleted validation away from being a script-injection sink,
          # and a sink whose safety rests on a check somewhere else is a sink.
          #
          # The lock and the manifest leave together, digested, with a binding
          # over the pair: the lock's content-hash comes from the manifest, so
          # either one applied alone describes a tree that does not exist.
          python scripts/kernel_lock.py evidence \
            --out /tmp/evidence \
            --manifest work/pyproject.toml \
            --lock work/poetry.lock \
            --resolver-log /tmp/resolver.log \
            --coordinate "ref=${REF}" \
            --coordinate "kernel_version=${KERNEL_VERSION}" \
            --coordinate "repository=${REPOSITORY}" \
            --coordinate "workflow_run=${RUN_ID}" \
            --coordinate "run_attempt=${RUN_ATTEMPT}" \
            --coordinate "resolved_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-lock-${{ inputs.kernel_version }}
          path: /tmp/evidence
          if-no-files-found: error

      - name: Say plainly that nothing was committed
        run: |
          echo "Resolved and verified. NOTHING was committed and no pull request"
          echo "was opened: download the artifact and apply BOTH pyproject.toml and"
          echo "poetry.lock in the pull request that moves the pin, so one reviewer"
          echo "sees the lock and the manifest it describes together. coordinates.txt"
          echo "says how to verify the pair before you apply it."
