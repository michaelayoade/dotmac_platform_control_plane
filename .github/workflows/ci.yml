# VALIDATION BRANCH ONLY: never merge this replacement of ci.yml.
name: Private producer source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require absent registry credentials and unchanged reviewed source
        run: |
          set -euo pipefail
          python -I -S -B -c 'import os; assert not any(v for k,v in os.environ.items() if k.startswith(("FORGEJO_", "POETRY_HTTP_BASIC_"))), "unexpected registry credential"'
          git diff --exit-code 2824e0fc9b0fa732eea0f26130e85282c6c79b9d HEAD -- scripts/kernel_lock.py scripts/warm_reviewed_private_artifacts.py .github/workflows/private-artifact-produce.yml tests/architecture/test_private_artifact_producer.py tests/architecture/test_run_block_expressions.py docs/operations/private-artifact-producer.md
      - name: Install only hash-pinned public test tools
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/source-tests"
          "$RUNNER_TEMP/source-tests/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/bootstrap/private-artifact-tests-requirements.txt
      - name: Run isolated source tests without application conftest
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/source-tests/bin/python" -I -m pytest --noconftest -o addopts='' -q --junitxml="$RUNNER_TEMP/source-tests.xml" tests/architecture/test_private_artifact_producer.py tests/architecture/test_kernel_lock_workflow.py tests/architecture/test_run_block_expressions.py::test_the_workflow_directory_holds_every_file_the_guard_must_reach
          "$RUNNER_TEMP/source-tests/bin/python" -I -c 'import os,xml.etree.ElementTree as E; r=E.parse(os.path.join(os.environ["RUNNER_TEMP"],"source-tests.xml")).getroot(); cases=list(r.iter("testcase")); assert cases and not any(c.find(t) is not None for c in cases for t in ("failure","error","skipped")), "source qualification incomplete"'
      - name: Retain synthetic JUnit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-producer-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-tests.xml
          if-no-files-found: error
          retention-days: 14
