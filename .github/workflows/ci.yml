name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback. GitHub does not run pull_request workflows for a
  # merge-CONFLICTED PR; the option-C spike branched off main~1 with a competing
  # accounts implementation at the same paths, so it conflicted with current main
  # and never ran (draft status / Actions spend were NOT the cause).
  # `workflow_dispatch` validates a branch HEAD on demand — note it is NOT the
  # synthetic merge with main, so it does not substitute for required PR CI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, dotmac-s3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      # The kernel resolves from the PRIVATE Forgejo registry, authenticated as the
      # dedicated `ci-reader` identity (a Forgejo user in the org's read-only
      # `ci-readers` team — package-read ONLY, no publish rights).
      # FORGEJO_READ_TOKEN is ci-reader's read:package token; its canonical source
      # is OpenBao (secret/dotmac/forgejo/read-token).
      - name: Install (kernel from Forgejo)
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Types
        run: poetry run mypy
      - name: Tests (boot + provisioning contract + D1–D5 deny cases)
        run: poetry run pytest -q
      # Postgres-backed suites. These were previously never run in CI: the
      # migration rehearsals and the replay-concurrency proof both SKIP without
      # TEST_DATABASE_URL, so a green pipeline said nothing about migration
      # safety or about FOR UPDATE SKIP LOCKED actually holding. A skipped
      # security test is not a passing one.
      # Commands are inlined rather than routed through `make`: the
      # self-hosted runner has no make, so the previous `make test-db-up`
      # failed with "command not found" — the Postgres suites SKIPPED and the
      # pipeline still reported green, which is exactly the failure mode this
      # step exists to prevent.
      - name: Start test Postgres
        env:
          TEST_DB_PORT: "5439"
          TEST_DB_NAME: vendor_cp_test
          TEST_DB_ADMIN_USER: postgres
          TEST_DB_ADMIN_PASSWORD: postgres
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          MIGRATION_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5439/vendor_cp_test \
            poetry run python scripts/migrate.py
      - name: Migration rehearsals + replay concurrency
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5439/vendor_cp_test
        # -p no:randomly is not needed; --strict-markers keeps a typo'd skip
        # from silently disabling a suite. `-rs` PRINTS skip reasons so a
        # skipped Postgres test is visible in the log rather than invisible.
        run: poetry run pytest tests/migration -q -rs
      - name: Stop test Postgres
        if: always()
        env:
          TEST_DB_PORT: "5439"
        run: docker compose -f docker-compose.test.yml down -v
