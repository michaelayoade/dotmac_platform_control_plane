name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback. GitHub does not run pull_request workflows for a
  # merge-CONFLICTED PR; the option-C spike branched off main~1 with a competing
  # accounts implementation at the same paths, so it conflicted with current main
  # and never ran (draft status / Actions spend were NOT the cause).
  # `workflow_dispatch` validates a branch HEAD on demand — note it is NOT the
  # synthetic merge with main, so it does not substitute for required PR CI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Test execution belongs on a disposable GitHub-hosted runner. The Vendor
    # CP has no reason to give repository code a persistent-host foothold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      # The kernel resolves from the PRIVATE Forgejo registry, authenticated as the
      # dedicated `ci-reader` identity (a Forgejo user in the org's read-only
      # `ci-readers` team — package-read ONLY, no publish rights).
      # FORGEJO_READ_TOKEN is ci-reader's read:package token; its canonical source
      # is OpenBao (secret/dotmac/forgejo/read-token).
      - name: Install (kernel from Forgejo)
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Types
        run: poetry run mypy
      - name: Tests (boot + provisioning contract + D1–D5 deny cases)
        run: poetry run pytest -q
      # Postgres-backed suites. These were previously never run in CI: the
      # migration rehearsals and the replay-concurrency proof both SKIP without
      # TEST_DATABASE_URL, so a green pipeline said nothing about migration
      # safety or about FOR UPDATE SKIP LOCKED actually holding. A skipped
      # security test is not a passing one.

  # Postgres-backed suites also run on a disposable GitHub-hosted runner.
  # `ubuntu-latest` reaches registry.dotmac.io (the kernel release workflow
  # already publishes to and installs from it there), so the private kernel
  # still resolves.
  postgres:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PORT: "5439"
      TEST_DB_HOST: localhost
      TEST_DB_NAME: vendor_cp_test
      TEST_DB_ADMIN_USER: postgres
      TEST_DB_ADMIN_PASSWORD: postgres
      # Turns a missing database into a FAILURE instead of a skip. `-rs` only
      # prints skips; under required CI a suite that can pass by skipping is
      # not a gate, which is exactly how this suite stayed silently unrun.
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - name: Install (kernel from Forgejo)
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install
      - name: Start disposable Postgres + migrate
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          MIGRATION_DATABASE_URL=postgresql+psycopg://app_admin@localhost:5439/vendor_cp_test \
            poetry run dotmac-platform admin migrate
      - name: Migration rehearsals + replay concurrency
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5439/vendor_cp_test
        run: poetry run pytest tests/migration -q -rs
      - name: Stop Postgres
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── THE PIN, EXECUTED ────────────────────────────────────────────────────
  # `docs/operations/composition-census-2026-08-30.md` recorded the composed
  # modules' declared kernel floors and then said the honest thing: "The floors
  # above are declarations, not contracts, and this census does not upgrade
  # them by repeating them." This job is that upgrade.
  #
  # `dotmac-deployment-control 0.1.0a5` is why. Its bytes were beyond doubt —
  # peeled commit, both digests, publisher read-back, an independent consumer
  # install, seven behavioural canaries — and it still could not boot here,
  # because it imported a kernel module its declared floor did not require. A
  # hash comparison proves you got the published bytes; it cannot prove they
  # import.
  #
  # Every version and every module name below is DERIVED. A literal in this
  # file is how a lane keeps passing after it has stopped testing anything —
  # bump the pin and a hard-coded mutation target installs a version the pin no
  # longer excludes, while a hard-coded module name demands a failure that can
  # no longer happen. `test_kernel_floor.py` greps this file for both.
  #
  # (No comment line here may end in a colon: the required-gate parser reads a
  # two-space-indented line ending in one as a job name, and would demand a gate
  # named after a sentence.)
  kernel-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - name: Install (kernel from Forgejo)
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install
      # One step, deliberately. The pin, the version below it and the module
      # names the failure must carry are three facts that have to describe the
      # same run; passing them between steps through the environment is how two
      # of them come to describe different ones.
      - name: The pin excludes the version below it, and the composition needs it
        env:
          TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f -- "${HOME}/.netrc"' EXIT HUP INT TERM
          umask 077
          : > "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
          printf 'machine %s login %s password %s\n' \
            "registry.dotmac.io" "ci-reader" "${TOKEN}" >> "${HOME}/.netrc"

          PIN=$(poetry run python scripts/kernel_floor.py pinned)
          echo "the assembly pins dotmac-kernel ${PIN}"
          echo "declared floors, read out of each composed artifact's metadata:"
          poetry run python scripts/kernel_floor.py floors
          echo "the pin is bound by: $(poetry run python scripts/kernel_floor.py binding)"

          # The index, not arithmetic. It has gaps — there is no published
          # 0.1.0a96 — and a target that was never published would make this
          # lane fail on a resolver error while reporting the pin proven.
          curl --netrc -sS --fail -o kernel-index.html \
            "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/dotmac-kernel/"
          EXCLUDED=$(poetry run python scripts/kernel_floor.py excluded --index-html kernel-index.html)
          echo "the newest published kernel this pin excludes: ${EXCLUDED}"

          # A scratch install of the excluded kernel, used ONLY as something to
          # compare against. Real files rather than a hand-kept table of which
          # alpha introduced which module: a table has rows somebody must
          # remember to add, and the row nobody added is invisible.
          python -m venv /tmp/excluded
          /tmp/excluded/bin/pip install --quiet --upgrade pip
          /tmp/excluded/bin/pip install --quiet --no-deps \
            --index-url "https://pypi.org/simple" \
            --extra-index-url "https://registry.dotmac.io/api/packages/dotmac/pypi/simple" \
            "dotmac-kernel==${EXCLUDED}"
          KERNEL_ROOT=$(/tmp/excluded/bin/python -c \
            "import importlib.util as u; print(u.find_spec('dotmac_kernel').submodule_search_locations[0])")

          # If this prints nothing the command exits non-zero and says why: the
          # pin would then be higher than anything the composition needs, and
          # the mutation below would be demanding a failure that cannot happen.
          poetry run python scripts/kernel_floor.py missing-from \
            --kernel-root "${KERNEL_ROOT}" > missing.txt
          echo "the composition imports these, and ${EXCLUDED} has none of them:"
          cat missing.txt

          # 1. THE RESOLVER. The pin has to be enforced by something that
          #    actually resolves, not only by a number in a file.
          python -m venv /tmp/resolver-check
          /tmp/resolver-check/bin/pip install --quiet --upgrade pip
          if /tmp/resolver-check/bin/pip install --quiet \
               --index-url "https://pypi.org/simple" \
               --extra-index-url "https://registry.dotmac.io/api/packages/dotmac/pypi/simple" \
               "dotmac-kernel==${PIN}" "dotmac-kernel==${EXCLUDED}" > resolver.log 2>&1; then
            echo "::error::pip installed dotmac-kernel ${PIN} and ${EXCLUDED} together."
            exit 1
          fi
          tail -n 5 resolver.log
          # The refusal has to be the RIGHT refusal. A step satisfied by any
          # non-zero pip would report the pin proven on a run where a typo'd
          # index URL was the only thing that happened.
          if ! grep -qiE "conflict|ResolutionImpossible|Cannot install" resolver.log; then
            echo "::error::pip failed, but not with a dependency conflict, so this"
            echo "half observed something other than the pin."
            exit 1
          fi
          echo "the resolver refuses the pair, as the pin requires"

          # THE OTHER HALF OF THE MAXIMUM. ADR 0021 sections 10 and 10.1,
          # settled 2026-09-01: the effective floor is the maximum of (a) every
          # composed distribution's installed Requires-Dist and (b) this
          # assembly's own direct constraint, read from ITS OWN SOURCE. Reading
          # the pin as that third input would return the pin, agree with itself
          # and prove nothing, so the assembly's contribution is derived from
          # what its code imports.
          #
          # Placed AFTER the composed-set conditions on purpose. Section 10.1
          # requires this to be plantable separately with those left intact, and
          # the finding to be DISTINCT: an assembly that out-imports its
          # composition is repaired in a different repository by a different
          # person than a composed module that raised its floor.
          #
          # The DSNs are dummies so the kernel can build its engine at import;
          # nothing connects. The driver is present because the assembly
          # declares it - and if it ever is not, this refuses to reason rather
          # than recording an environment gap as a missing kernel symbol.
          poetry run python scripts/kernel_floor.py assembly-needs
          # The three values the equality ranges over, printed side by side so a
          # reviewer reading the log can see WHICH input established the floor
          # rather than inferring it from the pin.
          poetry run python scripts/kernel_floor.py assembly-floor
          # `assembly-satisfied` ends by importing `vendor_cp.main`, which is
          # `create_app(build_spec())` at module scope: the same boot the
          # mutation lane drives below. A name-level sweep cannot see a symbol
          # that survived with a changed signature or field set, and that is
          # where a pin move actually breaks.
          DATABASE_URL=postgresql+psycopg://app_user@127.0.0.1:5432/vendor_cp \
          PLATFORM_DATABASE_URL=postgresql+psycopg://platform_api@127.0.0.1:5432/vendor_cp \
            poetry run python scripts/kernel_floor.py assembly-satisfied

          # 2. THE BEHAVIOUR. `--no-deps --force-reinstall` defeats the
          #    constraint on purpose: nothing else in the environment changes,
          #    so a failure below can only be the kernel downgrade.
          poetry run pip install --quiet --no-deps --force-reinstall \
            --index-url "https://pypi.org/simple" \
            --extra-index-url "https://registry.dotmac.io/api/packages/dotmac/pypi/simple" \
            "dotmac-kernel==${EXCLUDED}"
          status=0
          DATABASE_URL=postgresql+psycopg://app_user@127.0.0.1:5432/vendor_cp \
          PLATFORM_DATABASE_URL=postgresql+psycopg://platform_api@127.0.0.1:5432/vendor_cp \
            poetry run python -c "import vendor_cp.main" > mutation.txt 2>&1 || status=$?
          tail -n 20 mutation.txt
          if [ "${status}" -eq 0 ]; then
            echo "::error::this assembly booted on dotmac-kernel ${EXCLUDED}, which the"
            echo "pin ${PIN} excludes. The pin is then higher than anything the"
            echo "composition needs: lower it to the version actually required, or"
            echo "record in the same change why it was raised anyway."
            exit 1
          fi
          # 3. THE RIGHT FAILURE. Unrelated breakage must not be able to stand
          #    in for the proof, so the traceback has to name a module the
          #    excluded kernel was measured to be missing.
          matched=""
          while read -r module; do
            [ -n "${module}" ] || continue
            if grep -q -F -- "${module}" mutation.txt; then
              matched="${module}"
            fi
          done < missing.txt
          if [ -z "${matched}" ]; then
            echo "::error::the boot failed under dotmac-kernel ${EXCLUDED}, but its"
            echo "output names none of the modules that kernel is missing"
            echo "($(tr '\n' ' ' < missing.txt)). This mutation observed some other"
            echo "breakage and the pin is still unproven."
            exit 1
          fi
          echo "dotmac-kernel ${EXCLUDED} cannot boot this assembly: ${matched} is absent"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production runtime without publishing
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --secret id=forgejo_token,env=FORGEJO_READ_TOKEN \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag dotmac-vendor-control-plane:ci .
      - name: Boot-smoke the built bytes
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            --env DATABASE_URL=postgresql+psycopg://app_user@127.0.0.1:5432/vendor_cp \
            --env PLATFORM_DATABASE_URL=postgresql+psycopg://platform_api@127.0.0.1:5432/vendor_cp \
            dotmac-vendor-control-plane:ci \
            -c "from vendor_cp.main import app; \
                import vendor_cp.api_documentation as policy; \
                assert app is not None; \
                assert policy.classify_environment(None) == policy.PRODUCTION; \
                paths = {getattr(route, 'path', '') for route in app.routes}; \
                assert not paths & {'/docs', '/docs/oauth2-redirect', '/redoc'}, paths; \
                assert not policy.audit_api_documentation( \
                    app, policy.api_documentation_policy(policy.PRODUCTION))"
      # ── Clean-install acceptance ────────────────────────────────────────
      # Six steps, and step 3 is the one that cannot be faked. The runtime stage
      # installs a WHEEL and copies no `src` and no `scripts`, so the repository
      # root is not merely off the import path — it is not in the image. A
      # canary run against a checkout passes for the wrong reason, which is
      # exactly how `dotmac-deployment-control 0.1.0a4` shipped correct bytes
      # with a wrong self-report and nothing noticed.
      #
      # The dummy DSNs are so the kernel can BUILD its engine at import; the
      # container has no network at all, so nothing connects. Every command run
      # here is a documented help or safe diagnostic path.
      - name: Clean-install acceptance — no repository root, nothing from a checkout
        run: |
          set -euo pipefail
          image=dotmac-vendor-control-plane:ci
          platform() {
            docker run --rm --network none --entrypoint dotmac-platform \
              --env DATABASE_URL=postgresql+psycopg://app_user@127.0.0.1:5432/vendor_cp \
              --env PLATFORM_DATABASE_URL=postgresql+psycopg://platform_api@127.0.0.1:5432/vendor_cp \
              "$image" "$@"
          }

          # 3. Remove access to the repository root — structurally, by never
          #    putting it there. Asserted rather than assumed.
          docker run --rm --network none --entrypoint sh "$image" -c \
            'test ! -e /app/src && test ! -e /app/scripts && test ! -e /app/pyproject.toml'

          # 1 + 2. The wheel was built and installed into an empty environment:
          #        the console script exists, and its version came from the
          #        installer rather than from a literal in a source file.
          platform --version

          # 5 + 6. Nothing resolves outside purelib/platlib, and no mutating
          #        owner is claimed by two commands. --strict exits 6 on either.
          platform --format json diagnose self --strict
          platform --format json diagnose version
          platform --format json diagnose owners
          platform --format json diagnose composition
          platform --format json recovery capture-sql

          # 4. Every documented command's help path, driven from the owner table
          #    the installed artifact itself reports.
          platform --format json diagnose owners \
            | python3 -c 'import json,sys; [print(o["command"]) for o in json.load(sys.stdin)["data"]["owners"]]' \
            > /tmp/commands.txt
          test -s /tmp/commands.txt
          while read -r group name; do
            platform "$group" "$name" --help > /dev/null
          done < /tmp/commands.txt

          # The 3-versus-4 split has to survive the container boundary, because
          # that is where an operator reads it. `docker run` and
          # `docker compose run` both propagate the container's status unchanged.
          status=0
          platform --format json deployment foundation -- render > /dev/null || status=$?
          test "$status" -eq 4

      - name: Rehearse production manifest-volume ownership
        env:
          VENDOR_APP_IMAGE: dotmac-vendor-control-plane:ci
          VENDOR_DB_BOOTSTRAP_PASSWORD: bootstrap-placeholder
          VENDOR_DB_ADMIN_PASSWORD: admin-placeholder
          VENDOR_DB_APP_USER_PASSWORD: app-placeholder
          VENDOR_DB_PLATFORM_API_PASSWORD: platform-placeholder
          # The relay dispatcher's. A placeholder like its three
          # siblings: this rehearsal interpolates the compose file and
          # never starts the database, and `:?` in the compose file
          # makes an inventory that omits it fail closed — which is what
          # this job just proved by failing before the value existed.
          VENDOR_DB_DISPATCHER_PASSWORD: dispatcher-placeholder
          VENDOR_LICENCE_SIGNING_KEY_HOST_FILE: /tmp/not-used
        run: |
          set -euo pipefail
          volume=dotmac_vendor_control_plane_vendor_product_manifests
          cleanup() {
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose -f docker-compose.production.yml \
            --profile ops run --rm --no-deps manifest-init
          observed="$(docker run --rm --network none \
            --volume "$volume:/manifests:ro" \
            postgres:16 stat -c '%u:%g %a' /manifests)"
          test "$observed" = "10001:10001 750"

      # ── The acceptance battery, REHEARSED ────────────────────────────────
      # This is a rehearsal. It is NOT acceptance, and it does not weaken the
      # ordering in `production-image.yml`: acceptance is the same script run
      # against the exact candidate that is about to be published, and nothing
      # here substitutes for it. What this step buys is REACHABILITY.
      #
      # Every defect this battery has had was invisible until a publication run
      # executed it, because a publication run was the only thing that ever did.
      # Three arrived that way — a restore lane that landed zero tables, a
      # read-back comparing a config digest against a manifest digest, and a
      # role-contract assertion comparing PostgreSQL's `t`/`f` boolean OUTPUT
      # against a declared `true`/`false` CAST, which could never hold on any
      # correct database. Each cost a merge to protected main to discover and
      # another to fix, and each was a defect in the CHECK rather than in the
      # artifact.
      #
      # The same script, invoked against the image this job already built, makes
      # that whole class fail in review instead. One script, two callers: a copy
      # would drift, and a drifting rehearsal is worse than none.
      - name: Rehearse the acceptance battery against the built bytes
        # The revision the battery's profile readback expects. Supplied from
        # OUTSIDE the image on purpose: reading it back off the artifact would
        # make the expectation a copy of the claim it is checking. It is the
        # same value this job passed as `SOURCE_REVISION` when it built.
        env:
          CANDIDATE_SOURCE_REVISION: ${{ github.sha }}
        run: .github/candidate/acceptance.sh dotmac-vendor-control-plane:ci
