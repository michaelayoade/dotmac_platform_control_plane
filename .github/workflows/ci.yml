name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: this repo produces no pull_request run for DRAFT PRs (verified
  # on both `opened` and `synchronize`, with no draft/types filter in this
  # workflow) — a GitHub-side behaviour for this spending-restricted private repo,
  # not a fixable filter here. `workflow_dispatch` lets any branch (e.g. a spike)
  # be validated on demand without opening a ready PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, dotmac-s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      # The kernel resolves from the PRIVATE Forgejo registry. FORGEJO_READ_TOKEN
      # is a read:package token whose canonical source is OpenBao
      # (secret/dotmac/forgejo/*); it is scoped to read only.
      - name: Install (kernel from Forgejo)
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-publisher
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Types
        run: poetry run mypy
      - name: Tests (boot + provisioning contract + D1–D5 deny cases)
        run: poetry run pytest -q
