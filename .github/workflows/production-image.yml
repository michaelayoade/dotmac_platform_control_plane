name: Build immutable production image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: vendor-control-plane-production-image
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/michaelayoade/dotmac_vendor_control_plane
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    # A PR run and a failed main run may emit workflow_run events too. Neither
    # may publish production bytes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - name: Require a successful main event
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" = "main" || {
            echo "Production images may only be built from main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Re-assert that the successful SHA is still current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          test "$current_main" = "$SOURCE_SHA" || {
            echo "Refusing stale image build: $SOURCE_SHA is not current main." >&2
            exit 1
          }

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build, publish, and resolve the registry digest
        id: publish
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          tag="${IMAGE_REPOSITORY}:${SOURCE_SHA}"
          DOCKER_BUILDKIT=1 docker build \
            --secret id=forgejo_token,env=FORGEJO_READ_TOKEN \
            --build-arg "SOURCE_REVISION=${SOURCE_SHA}" \
            --tag "$tag" .
          docker push "$tag"
          docker pull "$tag"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke the published bytes
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            --env DATABASE_URL=postgresql+psycopg://app_user@127.0.0.1:5432/vendor_cp \
            --env PLATFORM_DATABASE_URL=postgresql+psycopg://platform_api@127.0.0.1:5432/vendor_cp \
            "${{ steps.publish.outputs.reference }}" \
            -c "from vendor_cp.main import app; assert app is not None"

      - name: Record deployment input
        run: |
          {
            echo '### Immutable Vendor CP image'
            echo '```text'
            echo '${{ steps.publish.outputs.reference }}'
            echo '```'
            echo "Source: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
