# Build a candidate, ACCEPT it, and only then publish it.
#
# The previous pipeline pushed and then smoked. A failing smoke therefore left
# published bytes that nothing had accepted, and the registry became a record of
# what was BUILT rather than of what PASSED — with no mechanism for removing the
# rejected tag, and every downstream consumer free to pin it.
#
# The order below is the whole point, and each step exists because the one
# before it cannot be trusted on its own:
#
#   1  select an exact protected-main revision
#   2  verify required CI actually succeeded on it — including that no required
#      gate SKIPPED, which a run-level success hides
#   3  build ONE local candidate, never pushed
#   4  record its identity: config digest, layers, RootFS chain, source
#      revision, lock digest, Dockerfile digest
#   5  test THOSE EXACT BYTES
#   6  publish the same config and layers
#   7  read the immutable registry digest back
#   8  prove what the registry holds equals what was accepted
#   9  emit a release receipt
#
# The registry can therefore only ever hold something that already passed.
name: Build immutable production image

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: >-
          Exact successful CI run id for the revision to publish. Verified
          against repository, workflow, conclusion, branch, SHA, current main
          and every required gate — a pasted id is not evidence on its own.
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  checks: read
  actions: read

concurrency:
  group: vendor-control-plane-production-image
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/michaelayoade/dotmac_vendor_control_plane
  CANDIDATE_TAG: candidate-local
  CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}

jobs:
  candidate:
    # A pull-request run and a failed main run emit workflow_run events too.
    # Neither may reach the publication path; the verifier below re-checks all
    # of this against the API rather than trusting the event payload.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      # ── 1. Select an exact protected-main revision ──────────────────────
      - name: Check out main to resolve its current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve current main
        id: select
        run: |
          set -euo pipefail
          current_main="$(git rev-parse HEAD)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          echo "source_sha=$current_main" >> "$GITHUB_OUTPUT"

      # ── 2. Verify required CI succeeded on exactly that revision ────────
      - name: Verify the source revision earned its way here
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/candidate/verify_source_revision.py \
            --run-id "${CI_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-path .github/workflows/ci.yml \
            --branch main \
            --expect-head "${{ steps.select.outputs.current_main }}"

      - name: Stage the exact Foundation candidate for the image build
        env:
          # Repository GITHUB_TOKEN is scoped to Platform CP and cannot read
          # another repository's Actions artifacts, even when that repository
          # is public. This credential is read-only Actions access to Starter.
          GH_TOKEN: ${{ secrets.FOUNDATION_ARTIFACT_READ_TOKEN }}
        run: python3 scripts/stage_foundation_candidate.py

      # ── 3. Build ONE local candidate. Nothing is pushed by this step. ───
      - name: Build the candidate
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --secret id=forgejo_token,env=FORGEJO_READ_TOKEN \
            --build-arg "SOURCE_REVISION=${{ steps.select.outputs.source_sha }}" \
            --tag "${CANDIDATE_TAG}" .

      # ── 4. Record what was built, before anything is done to it ─────────
      - name: Record the candidate's identity
        id: identity
        run: |
          set -euo pipefail
          # Preflight, HERE and not after the push. Step 8 reads the registry's
          # own config digest with `docker manifest inspect`, and a runner whose
          # CLI cannot run that subcommand would fail the pipeline with the bytes
          # already published and the receipt never emitted — the exact shape
          # this ordering exists to prevent. Proving the subcommand resolves
          # costs nothing and happens before anything is accepted, let alone
          # pushed.
          docker manifest inspect --help > /dev/null \
            || { echo "docker manifest inspect is unavailable on this runner" >&2; exit 1; }
          config_digest="$(docker image inspect --format '{{.Id}}' "${CANDIDATE_TAG}")"
          layers="$(docker image inspect --format '{{json .RootFS.Layers}}' "${CANDIDATE_TAG}")"
          # The RootFS chain digest is over the ORDERED layer list: two images
          # can share every layer and stack them differently, and that is a
          # different filesystem.
          rootfs_chain="$(printf '%s' "$layers" | sha256sum | cut -d' ' -f1)"
          lock_digest="$(sha256sum poetry.lock | cut -d' ' -f1)"
          dockerfile_digest="$(sha256sum Dockerfile | cut -d' ' -f1)"
          # Per-file digests of the wheel and the sdist, READ OUT of the
          # candidate rather than measured beside it. The image computed them in
          # the same build stage that installed the wheel; recomputing here
          # would mean a second `poetry build`, and a zip carries timestamps, so
          # that would describe bytes this image does not contain.
          #
          # Until now the receipt recorded bundle granularity only — the config
          # digest and the layer chain name the container, not the artifacts
          # inside it.
          docker run --rm --network none --entrypoint cat \
            "${CANDIDATE_TAG}" /app/distributions.json > candidate-distributions.json
          jq -e '[.files[].filename | endswith(".whl")] | any' \
            candidate-distributions.json > /dev/null
          jq -e '[.files[].filename | endswith(".tar.gz")] | any' \
            candidate-distributions.json > /dev/null
          jq -e '.files | length >= 2 and all(.sha256 | test("^sha256:[0-9a-f]{64}$"))' \
            candidate-distributions.json > /dev/null
          {
            echo "config_digest=$config_digest"
            echo "rootfs_chain=sha256:$rootfs_chain"
            echo "lock_digest=sha256:$lock_digest"
            echo "dockerfile_digest=sha256:$dockerfile_digest"
          } >> "$GITHUB_OUTPUT"
          jq -n \
            --arg source_revision "${{ steps.select.outputs.source_sha }}" \
            --arg config_digest "$config_digest" \
            --argjson layers "$layers" \
            --arg rootfs_chain "sha256:$rootfs_chain" \
            --arg lock_digest "sha256:$lock_digest" \
            --arg dockerfile_digest "sha256:$dockerfile_digest" \
            --argjson distributions "$(cat candidate-distributions.json)" \
            '{source_revision:$source_revision, config_digest:$config_digest,
              layers:$layers, rootfs_chain:$rootfs_chain,
              lock_digest:$lock_digest, dockerfile_digest:$dockerfile_digest,
              distributions:$distributions}' \
            > candidate-identity.json
          cat candidate-identity.json

      # ── 5. Test those exact bytes ───────────────────────────────────────
      - name: Accept the candidate, or refuse it
        run: .github/candidate/acceptance.sh "${CANDIDATE_TAG}"

      # ── 6. Publish the SAME config and layers ───────────────────────────
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish the accepted candidate
        id: publish
        run: |
          set -euo pipefail
          tag="${IMAGE_REPOSITORY}:${{ steps.select.outputs.source_sha }}"
          # `docker tag` renames; it does not rebuild. The config digest and the
          # layer chain recorded in step 4 are the ones that travel.
          docker tag "${CANDIDATE_TAG}" "$tag"
          docker push "$tag"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ── 7 + 8. Read back, and prove equality with what was accepted ─────
      - name: Prove the registry holds the accepted candidate
        id: readback
        run: |
          set -euo pipefail
          reference='${{ steps.publish.outputs.reference }}'
          # Remove every local reference first. Inspecting a tag that never left
          # the runner would compare the candidate with itself and pass without
          # the registry having been consulted at all.
          docker image rm -f "${CANDIDATE_TAG}" >/dev/null 2>&1 || true
          docker image rm -f "${IMAGE_REPOSITORY}:${{ steps.select.outputs.source_sha }}" >/dev/null 2>&1 || true
          docker image rm -f "$reference" >/dev/null 2>&1 || true
          docker image inspect "$reference" >/dev/null 2>&1 \
            && { echo "the candidate is still resident locally; the read-back would be a no-op" >&2; exit 1; }

          # Output KEPT, deliberately. The absence assertion above is what
          # makes this pull meaningful, but with the output discarded the run
          # log carried no direct evidence that the bytes came from the
          # registry — the proof rested entirely on the guard, and a reader
          # auditing the log afterwards could not see the fetch happen. The
          # layer lines and the resolved digest are cheap and they are the
          # observation.
          docker pull "$reference"
          pulled_layers="$(docker image inspect --format '{{json .RootFS.Layers}}' "$reference")"
          pulled_chain="sha256:$(printf '%s' "$pulled_layers" | sha256sum | cut -d' ' -f1)"
          accepted_chain='${{ steps.identity.outputs.rootfs_chain }}'

          # THE equality. `.RootFS.Layers` is the ordered list of layer diffIDs,
          # computed from uncompressed layer content and carried inside the
          # config blob — so it is the same object on both sides of a push, and
          # a difference here is a real difference in the filesystem.
          test "$pulled_chain" = "$accepted_chain" \
            || { echo "registry RootFS chain $pulled_chain != accepted $accepted_chain" >&2; exit 1; }

          # `.Id` is deliberately NOT compared across the push boundary, and
          # this is a correction rather than an omission. For a locally built
          # image `.Id` is the CONFIG digest; for an image pulled BY DIGEST
          # docker reports the MANIFEST digest in the same field. Measured on
          # a real published artifact, those are three different values:
          #
          #   manifest        sha256:b45d81c6…   (what you pull by)
          #   docker .Id      sha256:b45d81c6…   (the manifest digest again)
          #   config.digest   sha256:8a7ac23b…   (what the registry stores)
          #
          # Comparing the local config digest with the pulled `.Id` therefore
          # compares two different KINDS of value and can never hold — a false
          # refusal on every correct publication, arriving after the push. The
          # registry's own config digest is read from the manifest instead, and
          # recorded rather than guessed at.
          registry_config="$(docker manifest inspect "$reference" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')"
          [[ "$registry_config" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "the registry returned no usable config digest" >&2; exit 1; }
          echo "registry_config=$registry_config" >> "$GITHUB_OUTPUT"

          # The candidate's own config digest, recorded before publication, must
          # still describe the image we just pulled: same revision label, same
          # layer count. Cheap, and it catches a reference that resolved to a
          # different image entirely.
          pulled_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference")"
          test "$pulled_revision" = "${{ steps.select.outputs.source_sha }}" \
            || { echo "registry image is labelled $pulled_revision, not ${{ steps.select.outputs.source_sha }}" >&2; exit 1; }
          echo "registry bytes equal the accepted candidate"

      # ── 9. The receipt ──────────────────────────────────────────────────
      - name: Emit the release receipt
        run: |
          set -euo pipefail
          jq -n \
            --arg source_revision "${{ steps.select.outputs.source_sha }}" \
            --arg ci_run_id "${CI_RUN_ID}" \
            --arg release_run_id "${GITHUB_RUN_ID}" \
            --arg registry_digest "${{ steps.publish.outputs.digest }}" \
            --arg reference "${{ steps.publish.outputs.reference }}" \
            --arg config_digest "${{ steps.identity.outputs.config_digest }}" \
            --arg rootfs_chain "${{ steps.identity.outputs.rootfs_chain }}" \
            --arg lock_digest "${{ steps.identity.outputs.lock_digest }}" \
            --arg dockerfile_digest "${{ steps.identity.outputs.dockerfile_digest }}" \
            --arg registry_config_digest "${{ steps.readback.outputs.registry_config }}" \
            --argjson distributions "$(cat candidate-distributions.json)" \
            --arg accepted "candidate accepted before publication" \
            '{contract:"dotmac-candidate-release-receipt/1", accepted:$accepted,
              source_revision:$source_revision, ci_run_id:$ci_run_id,
              release_run_id:$release_run_id, registry_digest:$registry_digest,
              reference:$reference, config_digest:$config_digest,
              registry_config_digest:$registry_config_digest,
              rootfs_chain:$rootfs_chain, lock_digest:$lock_digest,
              dockerfile_digest:$dockerfile_digest,
              distributions:$distributions}' \
            > release-receipt.json
          cat release-receipt.json
          {
            echo '### Accepted before publication'
            echo '```json'
            cat release-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the receipt and the candidate identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-receipt-${{ steps.select.outputs.source_sha }}
          path: |
            release-receipt.json
            candidate-identity.json
            candidate-distributions.json
          retention-days: 90
