name: Rehearsal Issuer Harness

# The disposable Control a17 / Kernel a100 rehearsal-issuer conformance
# harness (`rehearsal_issuer_harness/`) is deliberately outside the
# application's default `testpaths`, so `ci.yml`'s `check` job never collects
# it. That made a "13 passed" claim in a pull request description a one-time
# manual run, never a reproducible gate. This job is that gate: a real,
# separate, always-runs-on-PR job -- not folded into an existing one -- that
# proves the harness against real Postgres, as the real `platform_api`
# runtime role, in a genuinely isolated environment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal-issuer-harness:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PORT: "5439"
      TEST_DB_NAME: vendor_cp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry

      # `docker-compose.test.yml` already mounts `init-roles.sh` -- the real
      # production role initializer -- so by the time this returns, all five
      # production roles exist with their exact production attributes. The
      # harness's own conftest only ever verifies that contract; it never
      # creates, alters, or grants a role.
      - name: Start disposable Postgres (init-roles.sh provisions the role contract)
        run: docker compose -f docker-compose.test.yml up -d --wait

      # A NORMAL, whole-repository build -- not a narrow one -- mirroring
      # conformance/README.md's own stated rationale: it is the --no-deps
      # install below, not a special build, that keeps the leaf boundary real.
      - name: Build this repository's own wheel
        run: poetry build

      - name: Create the isolated venv and install this repo's wheel with --no-deps
        run: |
          set -euo pipefail
          python3 -m venv /tmp/rehearsal-issuer-venv
          /tmp/rehearsal-issuer-venv/bin/pip install --quiet --upgrade pip
          wheel=$(ls dist/*.whl)
          echo "installing ${wheel} with --no-deps into an isolated venv"
          /tmp/rehearsal-issuer-venv/bin/pip install --no-deps "$wheel"

      # Same private-registry credential pattern as ci.yml's existing
      # kernel-pin job: a scoped netrc, removed unconditionally on exit.
      - name: Download the two locked private wheels and verify their sha256
        env:
          TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f -- "${HOME}/.netrc"' EXIT HUP INT TERM
          umask 077
          : > "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
          printf 'machine %s login %s password %s\n' \
            "registry.dotmac.io" "ci-reader" "${TOKEN}" >> "${HOME}/.netrc"

          mkdir -p /tmp/private-wheels
          /tmp/rehearsal-issuer-venv/bin/pip download --no-deps \
            --index-url "https://pypi.org/simple" \
            --extra-index-url "https://registry.dotmac.io/api/packages/dotmac/pypi/simple" \
            --dest /tmp/private-wheels \
            "dotmac-deployment-control==0.1.0a17" "dotmac-kernel==0.1.0a100"

          # Source-only approval conformance uses the already pinned release.
          /tmp/rehearsal-issuer-venv/bin/pip download --no-deps \
            --index-url "https://pypi.org/simple" \
            --extra-index-url "https://registry.dotmac.io/api/packages/dotmac/pypi/simple" \
            --dest /tmp/private-wheels "dotmac-approvals==0.1.0a8"

          # A CI-level sanity check only -- defense in depth. The harness's
          # own verify_wheels/verify_installed re-checks this again, from
          # first principles, at test collection time regardless.
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          lock = json.loads(
              pathlib.Path("rehearsal_issuer_harness/artifacts.json").read_text()
          )
          wheels = {p.name: p for p in pathlib.Path("/tmp/private-wheels").glob("*.whl")}
          import tomllib
          approvals = next(p for p in tomllib.loads(pathlib.Path("poetry.lock").read_text())["package"] if p["name"] == "dotmac-approvals")
          assert approvals["version"] == "0.1.0a8"
          approval_wheel = wheels["dotmac_approvals-0.1.0a8-py3-none-any.whl"]
          expected = next(f["hash"] for f in approvals["files"] if f["file"] == approval_wheel.name)
          assert "sha256:" + hashlib.sha256(approval_wheel.read_bytes()).hexdigest() == expected
          for name, spec in lock["artifacts"].items():
              path = wheels.get(spec["filename"])
              if path is None:
                  sys.exit(f"::error::{spec['filename']} was not downloaded")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != spec["sha256"]:
                  sys.exit(
                      f"::error::{name} sha256 {digest} differs from "
                      f"artifacts.json's {spec['sha256']}"
                  )
              print(f"{name} sha256 matches artifacts.json: {digest}")
          PY

      # verify_wheels/verify_installed check the DOWNLOADED files' bytes and
      # the RUNNING interpreter's installed metadata separately -- downloading
      # a wheel does not install it. Without this step, importlib.metadata
      # finds nothing for either distribution and pytest_configure's
      # verify_installed() call fails before pytest collects a single test.
      - name: Install the two locked private wheels into the isolated venv
        run: |
          set -euo pipefail
          /tmp/rehearsal-issuer-venv/bin/pip install --no-deps \
            /tmp/private-wheels/dotmac_deployment_control-*.whl \
            /tmp/private-wheels/dotmac_kernel-*.whl
          /tmp/rehearsal-issuer-venv/bin/pip install --no-deps \
            /tmp/private-wheels/dotmac_approvals-*.whl

      # The README's own documented recipe, verbatim.
      - name: Build the public wheelhouse from public-requirements.lock
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-wheelhouse
          /tmp/rehearsal-issuer-venv/bin/pip download --require-hashes \
            --dest /tmp/public-wheelhouse \
            -r rehearsal_issuer_harness/public-requirements.lock
          /tmp/rehearsal-issuer-venv/bin/pip install --require-hashes --no-index \
            --find-links /tmp/public-wheelhouse \
            -r rehearsal_issuer_harness/public-requirements.lock

      # Zero skips permitted. `-rs` prints a `SKIPPED ...` short-summary line
      # for any skip; a clean run has none, so this is checked by absence
      # rather than by matching a fragile "0 skipped" substring pytest does
      # not actually print when nothing was skipped.
      - name: Rehearsal issuer harness (real Postgres, real platform_api role)
        env:
          REHEARSAL_ISSUER_DATABASE_URL: "postgresql+psycopg://postgres@localhost:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}"
        run: |
          set -euo pipefail
          control_wheel=$(ls /tmp/private-wheels/dotmac_deployment_control-*.whl)
          kernel_wheel=$(ls /tmp/private-wheels/dotmac_kernel-*.whl)
          /tmp/rehearsal-issuer-venv/bin/python -m pytest rehearsal_issuer_harness/ \
            -q -rs --no-header \
            --control-wheel "$control_wheel" \
            --kernel-wheel "$kernel_wheel" \
            --public-wheelhouse /tmp/public-wheelhouse \
            | tee /tmp/rehearsal-issuer-output.log
          if grep -q '^SKIPPED' /tmp/rehearsal-issuer-output.log; then
            echo "::error::this suite must never skip"
            exit 1
          fi

      # Test-only Foundation build, never a release/candidate allocation. The
      # released Control wheel and CP wheel above stay in the isolated venv.
      - name: Fetch exact Foundation source for host-admission conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michaelayoade/dotmac_starter_mt
          ref: d74bf8dd8c399dd92047174365403b861f82ddd0
          path: .host-admission-foundation
          persist-credentials: false
      - name: Build and install the test-only Foundation wheel
        run: |
          set -euo pipefail
          foundation_dir="${GITHUB_WORKSPACE}/.host-admission-foundation"
          test "$(git -C "$foundation_dir" rev-parse HEAD)" = d74bf8dd8c399dd92047174365403b861f82ddd0
          test -z "$(git -C "$foundation_dir" status --porcelain=v1 --untracked-files=all)"
          poetry -C "$foundation_dir/packages/dotmac-deployment-foundation" build \
            --format wheel --output "$RUNNER_TEMP/host-admission-foundation-wheels"
          sha256sum "$RUNNER_TEMP"/host-admission-foundation-wheels/*.whl
          /tmp/rehearsal-issuer-venv/bin/pip install --no-index --no-deps \
            "$RUNNER_TEMP"/host-admission-foundation-wheels/*.whl
      - name: Real-wheel host-admission conformance at the adopted Control pin
        env:
          REHEARSAL_ISSUER_MIGRATION_DATABASE_URL: "postgresql+psycopg://app_admin@localhost:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}"
          CONFORMANCE_DATABASE_URL: "postgresql+psycopg://platform_api@localhost:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}"
          CONFORMANCE_PRIVATE_WHEELHOUSE: /tmp/private-wheels
          CONFORMANCE_PUBLIC_WHEELHOUSE: /tmp/public-wheelhouse
        run: |
          set -euo pipefail
          /tmp/rehearsal-issuer-venv/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          from alembic import command
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from dotmac_deployment_control import versions_dir
          from dotmac_approvals.migrations import versions_dir as approvals_versions_dir
          from dotmac_kernel.migrations import versions_dir as kernel_versions_dir
          import dotmac_deployment_control as control
          import dotmac_deployment_foundation as foundation
          import vendor_cp.deployment.host_admission_adapter as adapter
          for distribution, expected in (
              ("dotmac-deployment-control", "0.1.0a17"),
              ("dotmac-kernel", "0.1.0a100"),
              ("dotmac-approvals", "0.1.0a8"),
              ("dotmac-deployment-foundation", "0.4.0a1"),
          ):
              assert version(distribution) == expected, distribution
          installed = Path("/tmp/rehearsal-issuer-venv").resolve()
          for module in (control, foundation, adapter):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(installed), (module.__name__, str(origin))
              print(module.__name__, origin)
          cfg = Config("rehearsal_issuer_harness/alembic.ini")
          cfg.set_main_option("version_locations", os.pathsep.join(map(str, (kernel_versions_dir(), versions_dir(), approvals_versions_dir()))))
          assert set(ScriptDirectory.from_config(cfg).get_heads()) == {
              "0028_machine_attribution", "dc_0016_controller_key_nonreuse", "ap_0003_withdrawals"
          }
          command.upgrade(cfg, "heads")
          PY
          /tmp/rehearsal-issuer-venv/bin/python -m pytest -q -rs \
            conformance/test_host_admission_conformance.py \
            --junitxml="$RUNNER_TEMP/host-admission-conformance.xml"
          /tmp/rehearsal-issuer-venv/bin/python - "$RUNNER_TEMP/host-admission-conformance.xml" <<'PY'
          import sys
          from xml.etree import ElementTree
          cases = ElementTree.parse(sys.argv[1]).getroot().findall(".//testcase")
          expected = {
              "test_valid_signed_attestations_complete_the_full_flow",
              "test_a_trust_policy_genuinely_derived_from_resolved_context_completes_the_full_flow",
              "test_an_invalid_signature_stops_inside_real_foundation_code",
              "test_a_sentinel_foundation_failure_has_no_fallback",
              "test_an_altered_evidence_digest_is_refused",
              "test_a_substituted_verified_host_identity_is_refused",
              "test_a_substituted_verified_candidate_root_field_is_refused",
              "test_a_state_change_between_resolve_and_admission_consumes_nothing",
              "test_expiry_between_foundation_verification_and_final_admission_is_refused",
              "test_component_observer_runs_only_after_the_admission_transaction_commits",
              "test_real_cp_v3_refuses_an_approval_requiring_plan_before_finalization",
          } | {
              f"test_real_approved_cp_v3_lifecycle[{scenario}]"
              for scenario in (
                  "positive", "withdrawn", "replay", "finalize_failure", "expired",
                  "revoked", "changed_target", "changed_observation", "changed_host",
                  "ambiguous_commit", "swapped_request", "session_reuse",
                  "finalization_withdrawal",
              )
          }
          assert len(cases) == len(expected) == 24
          assert {case.attrib["name"] for case in cases} == expected
          assert all(not any(case.find(outcome) is not None for outcome in ("skipped", "failure", "error")) for case in cases)
          print("host-admission conformance: ten component cases, default refusal and thirteen real-approval source cases passed, zero skipped")
          PY

      - name: Stop Postgres
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
